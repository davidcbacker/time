name: Lint CSS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint_css:
    name: Lint CSS code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create package lock
        run: touch package-lock.json
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: '22'
      - name: Install CSS linters
        run: |
          npm install --no-save csslint stylelint stylelint-config-standard
      - name: Run csslint
        run: |
          npx csslint \
            --ignore=box-sizing,known-properties \
            src/style.css
      - name: Run Stylelint
        run: |
          npx stylelint \
            src/style.css \
            --config config/stylelint.json
